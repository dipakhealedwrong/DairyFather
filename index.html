<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मासिक डायरी जनरेटर – राजेंद्र पाटील</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Inter:wght@300;400;600;700&display=swap');

  :root {
    --saffron: #E8621A;
    --saffron-light: #F9EEE6;
    --saffron-mid: #F4C9A8;
    --ink: #1A1410;
    --ink-muted: #5A4A3A;
    --rule: #D4C4B0;
    --bg: #FBF7F3;
    --white: #FFFFFF;
    --green: #2C7A4B;
    --green-light: #E8F4EE;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--white);
    padding: 0;
    position: relative;
    overflow: hidden;
  }

  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 32px 36px;
    position: relative;
    z-index: 2;
  }

  .header-eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--saffron);
    font-weight: 600;
    margin-bottom: 12px;
  }

  .header-title {
    font-family: 'Tiro Devanagari Marathi', serif;
    font-size: 36px;
    line-height: 1.2;
    color: var(--white);
    margin-bottom: 6px;
  }

  .header-subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .header-accent {
    position: absolute;
    right: -60px;
    top: -60px;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,98,26,0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── EMPLOYEE CARD ── */
  .employee-bar {
    background: var(--saffron-light);
    border-bottom: 2px solid var(--saffron-mid);
    padding: 12px 32px;
  }

  .employee-bar-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .emp-label {
    font-size: 11px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .emp-name {
    font-family: 'Tiro Devanagari Marathi', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--saffron);
  }

  .emp-sep { color: var(--rule); font-size: 18px; }

  .emp-role {
    font-family: 'Tiro Devanagari Marathi', serif;
    font-size: 13px;
    color: var(--ink-muted);
  }

  /* ── MAIN ── */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 32px 80px;
  }

  .section-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--saffron);
    font-weight: 700;
    margin-bottom: 20px;
  }

  /* ── YEAR TABS ── */
  .year-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 40px;
    border-bottom: 2px solid var(--rule);
  }

  .year-tab {
    padding: 12px 32px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-muted);
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: color 0.2s, border-color 0.2s;
    letter-spacing: 1px;
  }

  .year-tab:hover { color: var(--saffron); }
  .year-tab.active {
    color: var(--saffron);
    border-bottom-color: var(--saffron);
  }

  /* ── MONTH GRID ── */
  .month-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .month-card {
    background: var(--white);
    border: 1.5px solid var(--rule);
    border-radius: 8px;
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }

  .month-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--rule);
    transition: background 0.2s;
  }

  .month-card:hover {
    border-color: var(--saffron);
    box-shadow: 0 4px 16px rgba(232,98,26,0.12);
    transform: translateY(-2px);
  }

  .month-card:hover::before { background: var(--saffron); }

  .month-marathi {
    font-family: 'Tiro Devanagari Marathi', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .month-english {
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .month-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .stat-pill {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .stat-work {
    background: var(--green-light);
    color: var(--green);
  }

  .stat-holiday {
    background: #EEF0F8;
    color: #4A5BA0;
  }

  .download-icon {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 28px;
    height: 28px;
    background: var(--saffron-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .month-card:hover .download-icon { opacity: 1; }

  .download-icon svg {
    width: 14px; height: 14px;
    fill: var(--saffron);
  }

  /* ── DOWNLOAD ALL ── */
  .bulk-bar {
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .btn-download-all {
    background: var(--saffron);
    color: white;
    border: none;
    padding: 11px 24px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
  }

  .btn-download-all:hover { background: #C0511A; }

  .btn-download-all svg {
    width: 16px; height: 16px; fill: white;
  }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Tiro Devanagari Marathi', serif;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    transition: transform 0.3s;
    z-index: 100;
    white-space: nowrap;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 24px;
    font-size: 11px;
    color: var(--rule);
    letter-spacing: 1px;
    border-top: 1px solid var(--rule);
  }

  @media (max-width: 600px) {
    .header-title { font-size: 26px; }
    main { padding: 32px 20px 60px; }
    .year-tab { padding: 10px 20px; font-size: 14px; }
    .month-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-accent"></div>
  <div class="header-inner">
    <div class="header-eyebrow">राजेंद्र पाटील</div>
    <div class="header-title">मासिक डायरी जनरेटर</div>
    <div class="header-subtitle">Monthly Work Diary Generator · 2026 – 2028</div>
  </div>
</header>

<div class="employee-bar">
  <div class="employee-bar-inner">
    <span class="emp-label">कर्मचारी</span>
    <span class="emp-name">श्रीमती. मंगला पंडीत देवरे</span>
    <span class="emp-sep">·</span>
    <span class="emp-role">ग्रामसेवक – ग्रा.प खेडी खुर्द प्र.अ ता.अमळनेर</span>
  </div>
</div>

<main>
  <div class="bulk-bar">
    <div class="section-label">वर्ष निवडा &amp; डाउनलोड करा</div>
    <button class="btn-download-all" onclick="downloadAllMonths()">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      या वर्षातील सर्व महिने डाउनलोड करा
    </button>
  </div>

  <div class="year-tabs">
    <button class="year-tab active" onclick="setYear(2026, this)">२०२६</button>
    <button class="year-tab" onclick="setYear(2027, this)">२०२७</button>
    <button class="year-tab" onclick="setYear(2028, this)">२०२८</button>
  </div>

  <div class="month-grid" id="monthGrid"></div>
</main>

<div id="toast">डाउनलोड होत आहे...</div>

<footer>RAJENDRA PATIL &nbsp;·&nbsp; मासिक डायरी जनरेटर</footer>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────

const MONTHS_MR = [
  'जानेवारी','फेब्रुवारी','मार्च','एप्रिल','मे','जून',
  'जुलै','ऑगस्ट','सप्टेंबर','ऑक्टोबर','नोव्हेंबर','डिसेंबर'
];
const MONTHS_EN = [
  'January','February','March','April','May','June',
  'July','August','September','October','November','December'
];

// Devanagari numerals
const DN = ['०','१','२','३','४','५','६','७','८','९'];
function toDev(n) {
  return String(n).split('').map(c => /\d/.test(c) ? DN[+c] : c).join('');
}

// Days of week in Marathi (0=Sun)
const DAY_MR = ['रविवार','सोमवार','मंगळवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];

// Get number of days in month
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

// 0=Sun,6=Sat
function dayOfWeek(y, m, d) { return new Date(y, m-1, d).getDay(); }

function isHoliday(dow) { return dow === 0 || dow === 6; } // Sun or Sat

// Build diary data for given year/month
function buildDiaryData(year, month) {
  const days = daysInMonth(year, month);
  const rows = [];

  // Known special dates per month pattern (based on reference docs)
  // Regular patterns from reference: bank visits mid-month, BLO meetings, Panchayat Samiti meetings

  for (let d = 1; d <= days; d++) {
    const dow = dayOfWeek(year, month, d);
    const dateStr = `${toDev(d)}/${toDev(month < 10 ? '0'+month : month)}/${toDev(year)}`;
    
    if (isHoliday(dow)) {
      rows.push({
        date: dateStr,
        from: '',
        to: '',
        work: `${DAY_MR[dow]} सुट्टी`
      });
    } else {
      // Determine work details based on day patterns
      let from = 'खेडी खुर्द प्र.अ';
      let to = 'खेडी खुर्द प्र.अ';
      let work = 'दैनंदिन कार्यालयीन कामकाज';

      // First working day of month – Amlaner, Gharkul
      if (d === 1 || (d <= 3 && !isHoliday(dayOfWeek(year, month, 1)) && !isHoliday(dow) && getFirstWorkDay(year, month) === d)) {
        to = 'अमळनेर';
        work = 'दैनंदिन कार्यालयीन कामकाज, घरकुल';
      }
      // ~5th – Report submission
      else if (d >= 4 && d <= 6 && !isHoliday(dow)) {
        const nd = getNthWorkDay(year, month, 2);
        if (d === nd) { to = 'अमळनेर'; work = 'दैनंदिन कार्यालयीन कामकाज, रिपोर्ट देणे'; }
      }
      // ~6th – Panchayat Samiti meeting
      else if (d >= 5 && d <= 8) {
        const nd = getNthWorkDay(year, month, 3);
        if (d === nd) { to = 'अमळनेर'; work = 'दैनंदिन कार्यालयीन कामकाज, पं.स.अमळनेर मिटिंग'; }
      }
      // ~11th – Panchayat Samiti
      else if (d >= 10 && d <= 13) {
        const nd = getNthWorkDay(year, month, 6);
        if (d === nd) { to = 'अमळनेर'; work = 'दैनंदिन कार्यालयीन कामकाज, पं.स.अमळनेर'; }
      }
      // ~12th – Bank + BLO meeting
      else if (d >= 11 && d <= 14) {
        const nd = getNthWorkDay(year, month, 7);
        if (d === nd) { to = 'अमळनेर'; work = 'दैनंदिन कार्यालयीन कामकाज, बँकेत भरणा, BLO मिटिंग'; }
      }
      // ~13th – Bank
      else if (d >= 12 && d <= 15) {
        const nd = getNthWorkDay(year, month, 8);
        if (d === nd) { to = 'अमळनेर'; work = 'बँकेत भरणा'; }
      }
      // ~17th – BLO work
      else if (d >= 16 && d <= 19) {
        const nd = getNthWorkDay(year, month, 10);
        if (d === nd) { to = 'अमळनेर'; work = 'दैनंदिन कार्यालयीन कामकाज, Blo कामकाज'; }
      }
      // ~26-27th – Bank visits
      else if (d >= 24 && d <= 28) {
        const nd1 = getNthWorkDayFromEnd(year, month, 4);
        const nd2 = getNthWorkDayFromEnd(year, month, 3);
        if (d === nd1 || d === nd2) { to = 'अमळनेर'; work = 'दैनंदिन कार्यालयीन कामकाज, बँकेत भरणा'; }
      }
      // Last 2 working days – Bank
      else if (d >= days - 4) {
        const nd1 = getNthWorkDayFromEnd(year, month, 2);
        const nd2 = getNthWorkDayFromEnd(year, month, 1);
        if (d === nd1) { work = 'दैनंदिन कार्यालयीन कामकाज, बँकेत भरणा'; }
        if (d === nd2) { to = 'अमळनेर'; work = 'दैनंदिन कार्यालयीन कामकाज, बँकेत भरणा'; }
      }

      rows.push({ date: dateStr, from, to, work });
    }
  }

  return rows;
}

function getFirstWorkDay(y, m) {
  for (let d = 1; d <= 31; d++) {
    if (d > daysInMonth(y, m)) break;
    if (!isHoliday(dayOfWeek(y, m, d))) return d;
  }
  return 1;
}

function getNthWorkDay(y, m, n) {
  let count = 0;
  for (let d = 1; d <= daysInMonth(y, m); d++) {
    if (!isHoliday(dayOfWeek(y, m, d))) {
      count++;
      if (count === n) return d;
    }
  }
  return daysInMonth(y, m);
}

function getNthWorkDayFromEnd(y, m, n) {
  let count = 0;
  for (let d = daysInMonth(y, m); d >= 1; d--) {
    if (!isHoliday(dayOfWeek(y, m, d))) {
      count++;
      if (count === n) return d;
    }
  }
  return 1;
}

function calcSummary(rows) {
  let work = 0, travel = 0, holiday = 0;
  rows.forEach(r => {
    if (r.work.includes('सुट्टी')) { holiday++; }
    else {
      work++;
      if (r.to === 'अमळनेर') travel++;
    }
  });
  return { work, travel, holiday, total: rows.length };
}

// ─── DOCX GENERATION ─────────────────────────────────────────────────────────

function xmlEscape(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildDocx(year, month) {
  const rows = buildDiaryData(year, month);
  const summary = calcSummary(rows);
  const monthMr = MONTHS_MR[month - 1];
  const title = `मासिक डायरी, माहे- ${monthMr} ${toDev(year)}`;

  // Build table rows XML
  // Header row
  const headerRow = `
    <w:tr>
      <w:trPr><w:trHeight w:val="400" w:hRule="atLeast"/><w:tblHeader/></w:trPr>
      ${['दिनांक','कोठून','कुठे','कामाचा तपशील'].map((h,i) => `
      <w:tc>
        <w:tcPr>
          <w:tcW w:w="${[1400,1800,1800,4560][i]}" w:type="dxa"/>
          <w:shd w:val="clear" w:color="auto" w:fill="2F4F8F"/>
        </w:tcPr>
        <w:p>
          <w:pPr><w:jc w:val="center"/></w:pPr>
          <w:r><w:rPr><w:b/><w:color w:val="FFFFFF"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr><w:t>${xmlEscape(h)}</w:t></w:r>
        </w:p>
      </w:tc>`).join('')}
    </w:tr>`;

  const dataRows = rows.map(row => {
    const isHol = row.work.includes('सुट्टी');
    const fill = isHol ? 'F5F5F5' : 'FFFFFF';
    return `
    <w:tr>
      <w:trPr><w:trHeight w:val="360" w:hRule="atLeast"/></w:trPr>
      ${[row.date, row.from, row.to, row.work].map((cell, i) => `
      <w:tc>
        <w:tcPr>
          <w:tcW w:w="${[1400,1800,1800,4560][i]}" w:type="dxa"/>
          <w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>
        </w:tcPr>
        <w:p>
          <w:pPr><w:jc w:val="${i === 3 ? 'left' : 'center'}"/></w:pPr>
          <w:r><w:rPr><w:sz w:val="18"/><w:szCs w:val="18"/>${isHol && i===3 ? '<w:color w:val="666666"/>' : ''}</w:rPr><w:t xml:space="preserve">${xmlEscape(cell)}</w:t></w:r>
        </w:p>
      </w:tc>`).join('')}
    </w:tr>`;
  }).join('');

  const docXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:wpc="http://schemas.microsoft.com/office/word/2010/wordprocessingCanvas"
  xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"
  xmlns:o="urn:schemas-microsoft-com:office:office"
  xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
  xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:wp14="http://schemas.microsoft.com/office/word/2010/wordprocessingDrawing"
  xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
  xmlns:w10="urn:schemas-microsoft-com:office:word"
  xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
  xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml"
  xmlns:wpg="http://schemas.microsoft.com/office/word/2010/wordprocessingGroup"
  xmlns:wpi="http://schemas.microsoft.com/office/word/2010/wordprocessingInk"
  xmlns:wne="http://schemas.microsoft.com/office/word/2006/wordml"
  xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape"
  mc:Ignorable="w14 wp14">
<w:body>

  <!-- TITLE -->
  <w:p>
    <w:pPr>
      <w:jc w:val="center"/>
      <w:spacing w:before="0" w:after="80"/>
    </w:pPr>
    <w:r>
      <w:rPr><w:b/><w:sz w:val="28"/><w:szCs w:val="28"/></w:rPr>
      <w:t>${xmlEscape(title)}</w:t>
    </w:r>
  </w:p>

  <!-- EMPLOYEE INFO -->
  <w:p>
    <w:pPr><w:spacing w:before="0" w:after="120"/></w:pPr>
    <w:r>
      <w:rPr><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr>
      <w:t xml:space="preserve">कर्मचाऱ्याचे नाव- श्रीमती. मंगला पंडीत देवरे                                          ग्रामसेवक - ग्रा.प खेडी खुर्द प्र.अ ता.अमळनेर</w:t>
    </w:r>
  </w:p>

  <!-- TABLE -->
  <w:tbl>
    <w:tblPr>
      <w:tblStyle w:val="TableGrid"/>
      <w:tblW w:w="9560" w:type="dxa"/>
      <w:tblBorders>
        <w:top w:val="single" w:sz="4" w:space="0" w:color="AAAAAA"/>
        <w:left w:val="single" w:sz="4" w:space="0" w:color="AAAAAA"/>
        <w:bottom w:val="single" w:sz="4" w:space="0" w:color="AAAAAA"/>
        <w:right w:val="single" w:sz="4" w:space="0" w:color="AAAAAA"/>
        <w:insideH w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>
        <w:insideV w:val="single" w:sz="4" w:space="0" w:color="CCCCCC"/>
      </w:tblBorders>
      <w:tblCellMar>
        <w:top w:w="60" w:type="dxa"/>
        <w:left w:w="100" w:type="dxa"/>
        <w:bottom w:w="60" w:type="dxa"/>
        <w:right w:w="100" w:type="dxa"/>
      </w:tblCellMar>
      <w:tblLook w:val="04A0"/>
    </w:tblPr>
    <w:tblGrid>
      <w:gridCol w:w="1400"/>
      <w:gridCol w:w="1800"/>
      <w:gridCol w:w="1800"/>
      <w:gridCol w:w="4560"/>
    </w:tblGrid>
    ${headerRow}
    ${dataRows}
  </w:tbl>

  <!-- SPACER -->
  <w:p><w:pPr><w:spacing w:before="200" w:after="0"/></w:pPr></w:p>

  <!-- SUMMARY -->
  ${[
    `   कामकाजाचे दिवस.  -------   ${toDev(summary.work)}`,
    `   त्यापैकी फिरस्तीचे दिवस --   ${toDev(summary.travel)}`,
    `           किरकोळ रजा  ---   ०`,
    `           सुट्टीचे दिवस –    ${toDev(summary.holiday)}`,
    `              एकूण.-----     ${toDev(summary.total)}`
  ].map(line => `
  <w:p>
    <w:pPr><w:spacing w:before="40" w:after="40"/></w:pPr>
    <w:r><w:rPr><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr><w:t xml:space="preserve">${xmlEscape(line)}</w:t></w:r>
  </w:p>`).join('')}

  <w:sectPr>
    <w:pgSz w:w="12240" w:h="15840"/>
    <w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="720" w:footer="720" w:gutter="0"/>
  </w:sectPr>
</w:body>
</w:document>`;

  return docXml;
}

function buildDocxZip(year, month) {
  const zip = new JSZip();

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
  <Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/>
</Types>`;

  const relsRoot = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const relsWord = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>
</Relationships>`;

  const settings = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:defaultTabStop w:val="720"/>
  <w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat>
</w:settings>`;

  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults>
    <w:rPrDefault>
      <w:rPr>
        <w:rFonts w:ascii="Mangal" w:hAnsi="Mangal" w:cs="Mangal"/>
        <w:sz w:val="22"/>
        <w:szCs w:val="22"/>
      </w:rPr>
    </w:rPrDefault>
  </w:docDefaults>
  <w:style w:type="table" w:styleId="TableGrid">
    <w:name w:val="Table Grid"/>
    <w:tblPr>
      <w:tblBorders>
        <w:top w:val="single" w:sz="4" w:space="0" w:color="auto"/>
        <w:left w:val="single" w:sz="4" w:space="0" w:color="auto"/>
        <w:bottom w:val="single" w:sz="4" w:space="0" w:color="auto"/>
        <w:right w:val="single" w:sz="4" w:space="0" w:color="auto"/>
        <w:insideH w:val="single" w:sz="4" w:space="0" w:color="auto"/>
        <w:insideV w:val="single" w:sz="4" w:space="0" w:color="auto"/>
      </w:tblBorders>
    </w:tblPr>
  </w:style>
</w:styles>`;

  zip.file('[Content_Types].xml', contentTypes);
  zip.file('_rels/.rels', relsRoot);
  zip.file('word/document.xml', buildDocx(year, month));
  zip.file('word/_rels/document.xml.rels', relsWord);
  zip.file('word/styles.xml', styles);
  zip.file('word/settings.xml', settings);

  return zip;
}

const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';

async function getDocxBlob(year, month) {
  const zip = buildDocxZip(year, month);
  const ab = await zip.generateAsync({ type: 'arraybuffer', mimeType: DOCX_MIME });
  return new Blob([ab], { type: DOCX_MIME });
}

async function downloadDiary(year, month) {
  showToast(`${MONTHS_MR[month-1]} ${toDev(year)} – डाउनलोड होत आहे...`);
  try {
    const blob = await getDocxBlob(year, month);
    const filename = `मासिक_डायरी_${MONTHS_EN[month-1]}_${year}.docx`;

    // Android Chrome / Samsung Browser: try navigator.share with file first
    if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: DOCX_MIME })] })) {
      try {
        await navigator.share({
          files: [new File([blob], filename, { type: DOCX_MIME })],
          title: filename
        });
        showToast(`✓ ${MONTHS_MR[month-1]} ${toDev(year)} तयार!`);
        return;
      } catch(shareErr) {
        // User cancelled share or share failed — fall through to download
        if (shareErr.name === 'AbortError') return;
      }
    }

    // Standard download fallback
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.type = DOCX_MIME;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    showToast(`✓ ${MONTHS_MR[month-1]} ${toDev(year)} डाउनलोड झाले!`);
  } catch(e) {
    console.error(e);
    showToast('❌ Error: ' + e.message);
  }
}

async function downloadAllMonths() {
  const year = currentYear;
  showToast(`${toDev(year)} चे सर्व महिने डाउनलोड होत आहेत...`);
  for (let m = 1; m <= 12; m++) {
    await new Promise(r => setTimeout(r, 300));
    const blob = await getDocxBlob(year, m);
    const filename = `मासिक_डायरी_${MONTHS_EN[m-1]}_${year}.docx`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.type = DOCX_MIME;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  }
  showToast(`✓ ${toDev(year)} – सर्व १२ महिने डाउनलोड झाले!`);
}

// ─── UI ──────────────────────────────────────────────────────────────────────

let currentYear = 2026;

function setYear(y, btn) {
  currentYear = y;
  document.querySelectorAll('.year-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderGrid(y);
}

function renderGrid(year) {
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const rows = buildDiaryData(year, m);
    const sum = calcSummary(rows);
    const card = document.createElement('div');
    card.className = 'month-card';
    card.onclick = () => downloadDiary(year, m);
    card.innerHTML = `
      <div class="month-marathi">${MONTHS_MR[m-1]}</div>
      <div class="month-english">${MONTHS_EN[m-1]} ${year}</div>
      <div class="month-stats">
        <span class="stat-pill stat-work">कामकाज: ${toDev(sum.work)}</span>
        <span class="stat-pill stat-holiday">सुट्टी: ${toDev(sum.holiday)}</span>
      </div>
      <div class="download-icon">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </div>`;
    grid.appendChild(card);
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// Init
renderGrid(2026);
</script>
